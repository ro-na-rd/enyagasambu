<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0e1f4b" stroke="#E85D04" stroke-width="3"/>
  
  <!-- Shopping cart main body -->
  <g transform="translate(50, 50)">
    <!-- Cart handle -->
    <path d="M 25 15 Q 35 5 45 15" stroke="#E85D04" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart basket -->
    <path d="M 20 20 L 15 55 Q 15 60 20 60 L 70 60 Q 75 60 75 55 L 70 20 Z" stroke="#E85D04" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart dividers -->
    <line x1="30" y1="20" x2="25" y2="60" stroke="#E85D04" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="47.5" y1="20" x2="47.5" y2="60" stroke="#E85D04" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="65" y1="20" x2="70" y2="60" stroke="#E85D04" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- "E" Letter in center -->
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#E85D04" text-anchor="middle" dominant-baseline="middle">E</text>
  
  <!-- Decorative dots -->
  <circle cx="155" cy="155" r="6" fill="#E85D04"/>
  <circle cx="175" cy="140" r="5" fill="#E85D04"/>
  <circle cx="168" cy="170" r="4" fill="#E85D04"/>
</svg>
