services:
  mysql:
    ports: []
    volumes:
      - mysql_data:/var/lib/mysql
  minio:
    ports: []

  # Backend API replicas. Caddy (below) load-balances across them via the
  # upstream_backend block in the Caddyfile. Scale with:
  #   docker compose -f docker-compose.prod.yml up --scale backend=3 -d
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CLUSTER_WORKERS: ${CLUSTER_WORKERS:-2}
      ENABLE_SCHEDULERS: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DB_NAME: nmo_db
      DB_POOL_LIMIT: ${DB_POOL_LIMIT:-20}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in .env (comma-separated origins)}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      LOG_DIR: /app/logs
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-50}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      MAX_CONCURRENT_REQUESTS: ${MAX_CONCURRENT_REQUESTS:-0}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: nmo-images
      S3_REGION: us-east-1
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL in .env}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Dedicated scheduler worker. Runs background jobs (expiry, reminders,
  # auctions, payment reconciliation) exactly once — not per backend replica.
  scheduler:
    build: ./backend
    restart: unless-stopped
    command: node src/worker.js
    environment:
      NODE_ENV: production
      ENABLE_SCHEDULERS: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DB_NAME: nmo_db
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: nmo-images
      S3_REGION: us-east-1
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?Set S3_PUBLIC_URL in .env}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env}
        BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
      PORT: 3000
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
