name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (syntax + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure test environment
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=ci
          DB_PASSWORD=ci
          DB_NAME=nmo_ci
          JWT_SECRET=ci-test-secret-that-is-at-least-32-characters-long
          CLIENT_URL=http://localhost:3000
          S3_PUBLIC_URL=http://localhost:9000/nmo-images
          EOF

      - name: Syntax-check all sources
        run: node -e "const fs=require('fs'),cp=require('child_process');const walk=d=>fs.readdirSync(d,{withFileTypes:true}).forEach(e=>{const p=d+'/'+e.name;e.isDirectory()?walk(p):e.name.endsWith('.js')&&cp.execSync('node --check \"'+p+'\"',{stdio:'inherit'})});walk('src')"

      - name: Unit tests
        run: npm run test:unit

  frontend:
    name: Frontend (lint + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
